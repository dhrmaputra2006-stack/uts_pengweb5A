<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Produk</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Styling seluruh komponen katalog */
    .catalog-container { max-width: 1200px; margin: 3rem auto; padding: 0 5%; }
    .catalog-controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 2rem; background: var(--white); padding: 1.2rem; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--gray-border); }
    .search-box { padding: 0.7rem 1rem; width: 100%; max-width: 320px; border: 1px solid var(--gray-border); border-radius: var(--radius); font-size: 0.95rem; outline: none; }
    .filter-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filter-btn { padding: 0.6rem 1.2rem; border: none; background-color: var(--light); color: var(--dark); font-weight: 600; border-radius: var(--radius); cursor: pointer; transition: var(--transition); }
    .filter-btn.active, .filter-btn:hover { background-color: var(--primary); color: var(--white); }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.8rem; }
    .badge { display: inline-block; font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; font-weight: 600; margin-bottom: 0.5rem; text-transform: uppercase; }
    .badge-hias { background-color: #e0f2fe; color: #0369a1; }
    .badge-predator { background-color: #fee2e2; color: #991b1b; }
    .btn-order-item { display: block; width: 100%; text-align: center; margin-top: 1rem; padding: 0.6rem; background-color: var(--primary); color: var(--white); border-radius: var(--radius); font-weight: 600; font-size: 0.9rem; transition: var(--transition); }
    .btn-order-item:hover { background-color: var(--accent); }
  </style>
</head>
<body>

  <!-- NAVBAR & DROPDOWN -->
  <nav class="navbar">
    <div class="logo">Pu<span>Fish</span></div>
    <ul class="nav-links">
      <li><a href="index.html">Beranda</a></li>
      <li class="dropdown">
        <a href="about.html">About ▾</a>
        <ul class="dropdown-menu">
          <li><a href="#profil">Profil Toko</a></li>
          <li><a href="#sejarah">Sejarah Toko</a></li>
          <li><a href="#visimisi">Visi & Misi</a></li>
          <li><a href="#tujuan">Tujuan Toko</a></li>
        </ul>
      </li>
      <li><a href="catalog.html" class="active">Katalog</a></li>
      <li><a href="order.html">Form Pemesanan</a></li>
      <li><a href="contact.html">Kontak</a></li>
    </ul>
  </nav>

  <!-- KONTEN KATALOG -->
  <div class="catalog-container">
    <h1 style="text-align: center; color: var(--primary); margin-bottom: 2rem; font-size: 2.2rem;">Katalog Koleksi Ikan</h1>

    <div class="catalog-controls">
      <input type="text" id="searchInput" class="search-box" placeholder="Cari nama ikan..." onkeyup="filterProducts()">
      <div class="filter-buttons">
        <button class="filter-btn active" onclick="setCategory('all', event)">Semua (12)</button>
        <button class="filter-btn" onclick="setCategory('hias', event)">Ikan Hias (6)</button>
        <button class="filter-btn" onclick="setCategory('predator', event)">Ikan Predator (6)</button>
      </div>
    </div>

    <!-- Grid Produk -->
    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 PuFish</p>
    <p>Official Website: <a href="https://www.pufish.com" target="_blank">www.pufish.com</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
